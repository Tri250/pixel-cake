:root {
  color-scheme: light;
  --surface: #F7F7F8;
  --surface-muted: #EFEFF2;
  --text: #171717;
  --text-muted: #52525B;
  --border: rgba(23, 23, 23, 0.12);
  --brand: #4B3FE3;
  --brand-soft: #F2F7FF;
  --brand-text: #1A1759;
  --chart-series-1: #3C2ECA;
  --chart-series-2: #A9AEFF;
  --chart-series-4: #22A5F7;
  --accent: #27D2BF;
  --success: #1DC981;

  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface: #171717;
    --surface-muted: #262626;
    --text: #E5E5E5;
    --text-muted: #A1A1AA;
    --border: rgba(229, 229, 229, 0.12);
    --brand: #6054F1;
    --brand-soft: #1A1759;
    --brand-text: #CFD8FF;
    --chart-series-1: #4B3FE3;
  }
}
* { margin: 0; padding: 0; }
body { background: var(--surface); color: var(--text); font: 400 14px/20px var(--font-sans); display: flex; flex-direction: column; align-items: center; padding: 24px; }
h1 { font: 500 16px/24px var(--font-sans); margin-bottom: 4px; }
h2 { font: 500 16px/24px var(--font-sans); margin: 32px 0 4px; align-self: center; }
.sub { font: 400 12px/18px var(--font-sans); color: var(--text-muted); margin-bottom: 20px; text-align: center; }
.frame { width: 100%; max-width: 960px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
svg { width: 100%; height: auto; display: block; }
.th { fill: var(--text); font: 500 14px/20px var(--font-sans); }
.tt { fill: var(--text); font: 500 12px/18px var(--font-sans); }
.ts { fill: var(--text-muted); font: 400 12px/18px var(--font-sans); }
.tc { fill: var(--text); font: 400 12px/18px var(--font-sans); }
.tb { fill: var(--brand-text); font: 500 12px/18px var(--font-sans); }
.tw { fill: #FFFFFF; font: 500 12px/18px var(--font-sans); }
.tm { font: 400 12px/18px var(--font-mono); }
.card { fill: var(--surface); stroke: var(--border); }
</style>
</head>
