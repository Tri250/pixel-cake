<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOO 可视化编辑器 · 应用功能全景图</title>
<style>
:root {
  color-scheme: light;
  --surface: #F7F7F8;
  --surface-muted: #EFEFF2;
  --text: #171717;
  --text-muted: #52525B;
  --border: rgba(23, 23, 23, 0.12);
  --brand: #4B3FE3;
  --brand-soft: #F2F7FF;
  --brand-text: #1A1759;
  --font-sans: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface: #171717;
    --surface-muted: #262626;
    --text: #E5E5E5;
    --text-muted: #A1A1AA;
    --border: rgba(229, 229, 229, 0.12);
    --brand: #6054F1;
    --brand-soft: #1A1759;
    --brand-text: #CFD8FF;
  }
}
* { margin: 0; padding: 0; }
body { background: var(--surface); color: var(--text); font: 400 14px/20px var(--font-sans); display: flex; flex-direction: column; align-items: center; padding: 24px; }
h1 { font: 500 16px/24px var(--font-sans); margin-bottom: 4px; }
.sub { font: 400 12px/18px var(--font-sans); color: var(--text-muted); margin-bottom: 20px; }
.frame { width: 100%; max-width: 960px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
svg { width: 100%; height: auto; display: block; }
.th { fill: var(--text); font: 500 14px/20px var(--font-sans); }
.ts { fill: var(--text-muted); font: 400 12px/18px var(--font-sans); }
.tc { fill: var(--text); font: 400 12px/18px var(--font-sans); }
.tb { fill: var(--brand-text); font: 500 12px/18px var(--font-sans); }
.arr { stroke: var(--text-muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.grp { fill: var(--surface); stroke: var(--border); stroke-dasharray: 6 4; }
.chip { fill: var(--surface-muted); stroke: var(--border); }
</style>
</head>
