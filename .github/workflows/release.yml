name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  # ──────────────────────────────────────────
  # 1. Build & Test Backend
  # ──────────────────────────────────────────
  build-backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify backend imports
        run: |
          cd backend
          python -c "
import sys, numpy as np
sys.path.insert(0, '.')
from services.inpainting import InpaintingService
from services.segmentation import SegmentationService
from services.sky import SkyService
from services.enhance import EnhanceService
print('All backend imports successful')
svc = EnhanceService()
img = np.random.randint(0, 255, (100, 100, 3), dtype=np.uint8)
r = svc.adjust(img, brightness=0.1)
assert r.shape == img.shape
r = svc.apply_filter(img, 'morandi')
assert r.shape == img.shape
r = svc.face_slim(img, strength=0.3)
assert r.shape == img.shape
r = svc.apply_makeup(img, lipstick=0.3)
assert r.shape == img.shape
print('Backend smoke tests passed')
"

  # ──────────────────────────────────────────
  # 2. Build Frontend
  # ──────────────────────────────────────────
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Verify build output
        run: |
          test -d frontend/dist
          test -f frontend/dist/index.html
          test -d frontend/dist/assets
          echo "Frontend build verified"

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ──────────────────────────────────────────
  # 3. Package Release (Linux)
  # ──────────────────────────────────────────
  package-linux:
    name: Package (Linux)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install backend deps for package
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create release archive
        run: |
          VERSION=${GITHUB_REF_NAME:-v1.0.0}
          mkdir -p release
          # Copy backend
          cp -r backend release/backend
          # Copy frontend build
          mkdir -p release/frontend
          cp -r frontend/dist/* release/frontend/
          # Copy project files
          cp launcher.py release/
          cp README.md release/
          # Copy cascade models
          mkdir -p release/backend/models/cascades
          cp backend/models/cascades/*.xml release/backend/models/cascades/ 2>/dev/null || true
          # Create requirements
          cp backend/requirements.txt release/
          # Create launcher script
          cat > release/start.sh << 'STARTSCRIPT'
          #!/bin/bash
          cd "$(dirname "$0")"
          pip install -r requirements.txt 2>/dev/null
          python launcher.py
          STARTSCRIPT
          chmod +x release/start.sh
          # Create a simple launcher .bat for Windows
          cat > release/start.bat << 'STARTSCRIPT'
          @echo off
          cd /d "%~dp0"
          python launcher.py
          STARTSCRIPT
          # Copy setup.py
          cp setup.py release/
          # Create archive
          tar czf pixel-cake-${VERSION}.tar.gz -C release .
          echo "Created release archive: pixel-cake-${VERSION}.tar.gz"
          ls -lh pixel-cake-${VERSION}.tar.gz

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: pixel-cake-*.tar.gz
          retention-days: 30

  # ──────────────────────────────────────────
  # 4. Create GitHub Release
  # ──────────────────────────────────────────
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [package-linux]

    steps:
      - uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-assets

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME:-v1.0.0}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "## What's New" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "- Full AI image editing pipeline" >> $GITHUB_OUTPUT
          echo "- Enhanced inpainting with multi-model fallback (LaMa/SD/OpenCV)" >> $GITHUB_OUTPUT
          echo "- Improved segmentation (SAM2/SAM1/MediaPipe/traditional CV)" >> $GITHUB_OUTPUT
          echo "- Sky replacement with 6 presets + custom upload" >> $GITHUB_OUTPUT
          echo "- 9 color filters + 16 adjustment parameters" >> $GITHUB_OUTPUT
          echo "- AI color matching 2.0 (LAB + histogram specification)" >> $GITHUB_OUTPUT
          echo "- Auto-enhance flow with 7 steps" >> $GITHUB_OUTPUT
          echo "- OpenCV 5.x compatibility (4-level face detection fallback)" >> $GITHUB_OUTPUT
          echo "- Performance improvements (downsampling for large images)" >> $GITHUB_OUTPUT
          echo "- Download API for all processing results" >> $GITHUB_OUTPUT
          echo "- GitHub Actions CI + Release workflows" >> $GITHUB_OUTPUT
          echo "- Setup script for easy installation" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Pixel Cake ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          body: |
            ${{ steps.version.outputs.RELEASE_NOTES }}
          files: |
            release-assets/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
