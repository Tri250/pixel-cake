name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify backend imports
        run: |
          cd backend
          python test_smoke.py

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Verify build output
        run: |
          test -d frontend/dist
          test -f frontend/dist/index.html
          test -d frontend/dist/assets
          echo "Frontend build verified"

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  package-linux:
    name: Package (Linux)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install backend deps for package
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create release archive
        run: |
          VERSION=${GITHUB_REF_NAME:-v1.0.0}
          mkdir -p release
          cp -r backend release/backend
          mkdir -p release/frontend
          cp -r frontend/dist/* release/frontend/
          cp launcher.py release/
          cp README.md release/
          mkdir -p release/backend/models/cascades
          cp backend/models/cascades/*.xml release/backend/models/cascades/ 2>/dev/null || true
          cp backend/requirements.txt release/
          cat > release/start.sh << 'STARTSCRIPT'
          #!/bin/bash
          cd "$(dirname "$0")"
          pip install -r requirements.txt 2>/dev/null
          python launcher.py
          STARTSCRIPT
          chmod +x release/start.sh
          cat > release/start.bat << 'STARTSCRIPT'
          @echo off
          cd /d "%~dp0"
          python launcher.py
          STARTSCRIPT
          cp setup.py release/
          tar czf pixel-cake-${VERSION}.tar.gz -C release .
          echo "Created release archive: pixel-cake-${VERSION}.tar.gz"
          ls -lh pixel-cake-${VERSION}.tar.gz

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: pixel-cake-*.tar.gz
          retention-days: 30

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [package-linux]

    steps:
      - uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-assets

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME:-v1.0.0}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "## What's New" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "- Full AI image editing pipeline" >> $GITHUB_OUTPUT
          echo "- Multi-model fallback: LaMa/SD/OpenCV inpainting" >> $GITHUB_OUTPUT
          echo "- Segmentation: SAM2/SAM1/MediaPipe/traditional CV" >> $GITHUB_OUTPUT
          echo "- Sky replacement: 6 presets + custom upload" >> $GITHUB_OUTPUT
          echo "- 9 color filters + 16 adjustment parameters" >> $GITHUB_OUTPUT
          echo "- AI color matching 2.0 (LAB + histogram)" >> $GITHUB_OUTPUT
          echo "- OpenCV 5.x compatible face detection (4-level fallback)" >> $GITHUB_OUTPUT
          echo "- Performance: 3.5x speedup via downsampling" >> $GITHUB_OUTPUT
          echo "- Download API for all processing results" >> $GITHUB_OUTPUT
          echo "- GitHub Actions CI + Release workflows" >> $GITHUB_OUTPUT
          echo "- setup.py for easy installation" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Clean existing release if tag exists
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Delete existing release if it exists
          EXISTING_RELEASE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$VERSION")
          if echo "$EXISTING_RELEASE" | grep -q '"id"'; then
            RELEASE_ID=$(echo "$EXISTING_RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
            echo "Deleted existing release $RELEASE_ID"
          fi
          # Delete existing tag ref if it exists
          TAG_REF="refs/tags/$VERSION"
          curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/$TAG_REF" || true
          echo "Cleaned up existing tag $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Pixel Cake ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          body: |
            ${{ steps.version.outputs.RELEASE_NOTES }}
          files: |
            release-assets/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
