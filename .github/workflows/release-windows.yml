name: Release Build (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      build_exe:
        description: 'Build Windows EXE (slow)'
        required: true
        default: 'false'

permissions:
  contents: write

jobs:
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Verify build output
        run: |
          test -d frontend/dist
          test -f frontend/dist/index.html
          test -d frontend/dist/assets
          echo "Frontend build verified"

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  build-windows:
    name: Windows Build & Package
    runs-on: windows-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify backend imports
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          cd backend
          python test_smoke.py

      - name: Package as ZIP
        shell: pwsh
        run: |
          $VERSION = "${{ github.event.inputs.version }}"
          if (-not $VERSION) { $VERSION = "v1.0.0" }

          $PACKAGE_DIR = "release/pixel-cake-$VERSION-windows"
          New-Item -ItemType Directory -Force -Path $PACKAGE_DIR

          Copy-Item -Recurse backend "$PACKAGE_DIR/backend"
          New-Item -ItemType Directory -Force -Path "$PACKAGE_DIR/frontend"
          Copy-Item -Recurse frontend/dist/* "$PACKAGE_DIR/frontend/"
          Copy-Item launcher.py "$PACKAGE_DIR/"
          Copy-Item setup.py "$PACKAGE_DIR/"
          Copy-Item build.bat "$PACKAGE_DIR/"
          Copy-Item run.bat "$PACKAGE_DIR/"
          if (Test-Path README.md) { Copy-Item README.md "$PACKAGE_DIR/" }

          $startBat = "@echo off`nchcp 65001 >nul 2>&1`ncd /d `"%~dp0`"`npython -m pip install -r backend/requirements.txt -q`npython launcher.py`npause"
          $startBat | Out-File -FilePath "$PACKAGE_DIR/start.bat" -Encoding ASCII

          $readmeContent = "# Pixel Cake $VERSION - Windows`n`n## Quick Start`n1. Install Python 3.10+ from https://python.org`n2. Double-click start.bat`n`n## System Requirements`n- Windows 10/11 (64-bit)`n- Python 3.10+`n- 4GB+ RAM`n- GPU optional`n`n## Uninstall`npython setup.py uninstall"
          $readmeContent | Out-File -FilePath "$PACKAGE_DIR/README.md" -Encoding UTF8

          Compress-Archive -Path "$PACKAGE_DIR/*" -DestinationPath "pixel-cake-$VERSION-windows.zip" -Force

          $zipSize = [math]::Round((Get-Item "pixel-cake-$VERSION-windows.zip").Length / 1MB, 1)
          Write-Host "Created: pixel-cake-$VERSION-windows.zip ($zipSize MB)"

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: pixel-cake-*-windows.zip
          retention-days: 30

  create-windows-release:
    name: Create Windows Release
    runs-on: ubuntu-latest
    needs: [build-windows]
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: release-assets

      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="v1.0.0"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "## Pixel Cake ${VERSION} - Windows Release" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### System Requirements" >> $GITHUB_OUTPUT
          echo "- Windows 10/11 (64-bit)" >> $GITHUB_OUTPUT
          echo "- Python 3.10+" >> $GITHUB_OUTPUT
          echo "- 4GB+ RAM" >> $GITHUB_OUTPUT
          echo "- GPU optional (CUDA for acceleration)" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Installation" >> $GITHUB_OUTPUT
          echo "1. Extract archive" >> $GITHUB_OUTPUT
          echo "2. Double-click start.bat" >> $GITHUB_OUTPUT
          echo "3. Browser opens at http://127.0.0.1:8765" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Features" >> $GITHUB_OUTPUT
          echo "- Full AI image editing pipeline" >> $GITHUB_OUTPUT
          echo "- Inpainting / Segmentation / Sky Replacement" >> $GITHUB_OUTPUT
          echo "- 9 color filters + 16 adjustment parameters" >> $GITHUB_OUTPUT
          echo "- AI relighting, face slimming, makeup" >> $GITHUB_OUTPUT
          echo "- All processing runs locally" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Uninstall" >> $GITHUB_OUTPUT
          echo "python setup.py uninstall" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Clean existing release
        run: |
          VERSION=${{ steps.version.outputs.version }}
          EXISTING_RELEASE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$VERSION")
          if echo "$EXISTING_RELEASE" | grep -q '"id"'; then
            RELEASE_ID=$(echo "$EXISTING_RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
          fi
          TAG_REF="refs/tags/$VERSION"
          curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/$TAG_REF" || true

      - name: Create Windows Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Pixel Cake ${{ steps.version.outputs.version }} (Windows)"
          tag_name: ${{ steps.version.outputs.version }}
          body: |
            ${{ steps.version.outputs.RELEASE_NOTES }}
          files: |
            release-assets/*.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
