name: Release Build (Windows Installer)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      build_exe:
        description: 'Build Windows EXE with PyInstaller'
        required: true
        default: 'false'
      build_installer:
        description: 'Build Windows installer (setup.exe)'
        required: true
        default: 'true'

permissions:
  contents: write

jobs:
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Verify build output
        run: |
          test -d frontend/dist
          test -f frontend/dist/index.html
          test -d frontend/dist/assets
          echo "Frontend build verified"
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  build-windows:
    name: Windows Installer Build
    runs-on: windows-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow
      - name: Verify backend imports
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          cd backend
          python test_smoke.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $isccPath = $null
          $installDir = "C:\Inno Setup 6"
          $isccPath = Join-Path $installDir "ISCC.exe"

          if (-not (Test-Path $isccPath)) {
            Write-Host "Downloading Inno Setup 6.4.1 from GitHub..."
            $url = "https://github.com/jrsoftware/issrc/releases/download/is-6.4.1/innosetup-6.4.1.exe"
            $installer = "innosetup_install.exe"
            try {
              Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
            } catch {
              # Try alternate URL
              $url2 = "https://jrsoftware.org/download.php/is.exe"
              Invoke-WebRequest -Uri $url2 -OutFile $installer -UseBasicParsing
            }
            Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=`"$installDir`"" -Wait
            Remove-Item $installer -Force -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path $isccPath)) {
            # Search common paths
            $paths = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )
            foreach ($p in $paths) {
              if (Test-Path $p) { $isccPath = $p; $installDir = Split-Path $p; break }
            }
          }

          if (-not (Test-Path $isccPath)) {
            Write-Error "Inno Setup installation failed"
            exit 1
          }

          # Verify Languages folder
          $languagesDir = Join-Path $installDir "Languages"
          if (-not (Test-Path $languagesDir)) {
            Write-Host "Languages folder not found at $languagesDir"
            Write-Host "Listing Inno Setup dir:"
            Get-ChildItem $installDir -Directory | ForEach-Object { Write-Host "  $_" }
          }

          $englishIsl = Join-Path $languagesDir "English.isl"
          if (-not (Test-Path $englishIsl)) {
            Write-Error "English.isl not found. Inno Setup installation may be incomplete."
            exit 1
          }

          Write-Host "Inno Setup ready: $isccPath"
          Write-Host "Languages: $languagesDir"
          echo "ISCC_PATH=$isccPath" >> $env:GITHUB_OUTPUT

      - name: Create icon
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          python installer\create_icon.py

      - name: Build Windows EXE with PyInstaller
        shell: pwsh
        run: |
          Write-Host "Building PyInstaller EXE..."
          if (Test-Path "frontend_dist") { Remove-Item -Recurse -Force "frontend_dist" }
          Copy-Item -Recurse "frontend\dist" "frontend_dist"
          if (Test-Path "services") { Remove-Item -Recurse -Force "services" }
          if (Test-Path "utils") { Remove-Item -Recurse -Force "utils" }
          Copy-Item -Recurse "backend\services" "services"
          Copy-Item -Recurse "backend\utils" "utils"
          if (-not (Test-Path "backend\models\cascades")) {
            New-Item -ItemType Directory -Path "backend\models\cascades" -Force | Out-Null
          }
          python setup.py 2>&1 | Out-Null
          pip install pyinstaller 2>&1 | Out-Null
          pyinstaller pixel-cake.spec --clean --noconfirm
          if (-not (Test-Path "dist\PixelCake.exe")) {
            Write-Error "PixelCake.exe not found!"
            exit 1
          }
          $exeSize = [math]::Round((Get-Item "dist\PixelCake.exe").Length / 1MB, 1)
          Write-Host "EXE built: dist\PixelCake.exe ($exeSize MB)"

      - name: Build Windows installer (setup.exe)
        if: ${{ inputs.build_installer == 'true' }}
        shell: pwsh
        run: |
          $VERSION = "${{ github.event.inputs.version }}"
          if (-not $VERSION) { $VERSION = "v1.0.0" }
          Write-Host "Building Windows Installer version: $VERSION"

          # Find ISCC
          $isccPath = $env:ISCC_PATH
          if (-not $isccPath -or -not (Test-Path $isccPath)) {
            $isccPath = "C:\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $isccPath)) {
              $paths = @(
                "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
                "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
              )
              foreach ($p in $paths) {
                if (Test-Path $p) { $isccPath = $p; break }
              }
            }
          }
          if (-not (Test-Path $isccPath)) {
            Write-Error "ISCC not found"
            exit 1
          }

          $issPath = "installer\windows.iss"
          $issContent = Get-Content $issPath -Raw
          $oldPattern = '#define MyAppVersion "[^"]*"'
          $newLine = "#define MyAppVersion `"$VERSION`""
          $issContent = [regex]::Replace($issContent, $oldPattern, $newLine)
          Set-Content $issPath $issContent -Encoding UTF8 -NoNewline

          Write-Host "Running: $isccPath $issPath"
          & $isccPath $issPath 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE"
            exit 1
          }

          $installer = Get-ChildItem "installer_output\*.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No installer EXE found!"
            exit 1
          }
          $installerSize = [math]::Round($installer.Length / 1MB, 1)
          Write-Host "Installer built: $($installer.Name) ($installerSize MB)"

      - name: Package release files
        shell: pwsh
        run: |
          $VERSION = "${{ github.event.inputs.version }}"
          if (-not $VERSION) { $VERSION = "v1.0.0" }
          $RELEASE_DIR = "release\pixel-cake-$VERSION-windows"
          New-Item -ItemType Directory -Force -Path $RELEASE_DIR | Out-Null
          $installer = Get-ChildItem "installer_output\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName "$RELEASE_DIR\"
            Write-Host "  Added installer: $($installer.Name)"
          }
          if (Test-Path "dist\PixelCake.exe") {
            Copy-Item "dist\PixelCake.exe" "$RELEASE_DIR\"
            Write-Host "  Added PixelCake.exe"
          }
          Copy-Item -Recurse "backend" "$RELEASE_DIR\backend"
          New-Item -ItemType Directory -Force -Path "$RELEASE_DIR\frontend" | Out-Null
          if (Test-Path "frontend\dist") {
            Copy-Item -Recurse "frontend\dist\*" "$RELEASE_DIR\frontend\"
          }
          Copy-Item "launcher.py" "$RELEASE_DIR\"
          Copy-Item "setup.py" "$RELEASE_DIR\"
          Copy-Item "run.bat" "$RELEASE_DIR\"
          Copy-Item "build.bat" "$RELEASE_DIR\"
          Copy-Item "installer\install.bat" "$RELEASE_DIR\"
          Copy-Item "installer\uninstall.bat" "$RELEASE_DIR\"
          $versionInfo = "Pixel Cake $VERSION`nBuilt: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')`nPlatform: Windows`n"
          $versionInfo | Out-File "$RELEASE_DIR\VERSION.txt" -Encoding ASCII
          (Get-Content "installer\README_template.md" -Raw) -replace 'VERSION', $VERSION | Out-File "$RELEASE_DIR\README.md" -Encoding UTF8
          Compress-Archive -Path "$RELEASE_DIR\*" -DestinationPath "pixel-cake-$VERSION-windows.zip" -Force
          $zipSize = [math]::Round((Get-Item "pixel-cake-$VERSION-windows.zip").Length / 1MB, 1)
          Write-Host "Created: pixel-cake-$VERSION-windows.zip ($zipSize MB)"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            installer_output/*.exe
            pixel-cake-*-windows.zip
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows]
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets
      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="v1.0.0"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      - name: Clean existing release
        run: |
          VERSION=${{ steps.version.outputs.version }}
          EXISTING_RELEASE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/releases/tags/$VERSION")
          if echo "$EXISTING_RELEASE" | grep -q '"id"'; then
            RELEASE_ID=$(echo "$EXISTING_RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
          fi
          TAG_REF="refs/tags/$VERSION"
          curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/git/$TAG_REF" 2>/dev/null || true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Pixel Cake ${{ steps.version.outputs.version }} (Windows Installer)"
          tag_name: ${{ steps.version.outputs.version }}
          body: |
            ## Pixel Cake ${{ steps.version.outputs.version }} - Windows Release

            ### What's New
            - Full AI editing pipeline: inpainting, segmentation, sky replacement, enhancement
            - Security hardened: XSS/Clickjacking protection, input validation
            - Performance optimized: vectorized operations, lazy model loading
            - Windows native: proper installer, Start Menu, desktop shortcuts
            - 9 color filters + 16 adjustment parameters
            - 6 sky presets (sunset, blue, cloudy, starry, golden_hour, overcast)

            ### Downloads
            - **PixelCake-Setup-${{ steps.version.outputs.version }}-Windows.exe** - Full installer (recommended)
            - **pixel-cake-${{ steps.version.outputs.version }}-windows.zip** - Portable version

            ### System Requirements
            - Windows 10/11 (64-bit)
            - 4GB+ RAM
            - GPU optional (CUDA for acceleration)

            ### Privacy
            - All processing runs 100% locally
            - No data sent to external servers
          files: |
            release-assets/*.exe
            release-assets/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
