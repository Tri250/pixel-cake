name: Build & Publish

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # Windows 是权威发布平台（原生构建 + 打包 + 发布）；
          # Linux/macOS 作为兼容性验证，结果记录但不阻塞发布。
          - os: ubuntu-latest
            experimental: true
          - os: macos-latest
            experimental: true
          - os: windows-latest
            experimental: false
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 确保 python 命令可用（Linux/macOS）
        if: runner.os != 'Windows'
        run: |
          if ! command -v python >/dev/null 2>&1; then
            sudo ln -sf "$(command -v python3)" /usr/local/bin/python
          fi

      - name: 安装 npm 依赖
        run: npm ci

      - name: 安装 Python 测试依赖
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: 构建 M2Reloader（仅 Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run build:m2-native

      - name: TypeScript 编译
        run: npx tsc -p ./

      - name: ESLint 检查
        run: npm run lint

      - name: 全量回归测试
        env:
          # 按平台指定 Chromium 内核浏览器路径，保证 Linux/macOS/Windows 兼容性测试一致
          BOO_BROWSER_EXECUTABLE: ${{ runner.os == 'Linux' && '/usr/bin/google-chrome' || (runner.os == 'macOS' && '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' || 'C:/Program Files/Google/Chrome/Application/chrome.exe') }}
        run: npm run test:all

      # ---- 打包与发布链路（Windows 负责：原生组件必须由 MSVC 构建后打入 VSIX）----

      - name: 打包 VSIX
        if: runner.os == 'Windows'
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $packageJson = Join-Path $env:GITHUB_WORKSPACE 'package.json'
          $manifest = Get-Content -LiteralPath $packageJson -Raw | ConvertFrom-Json

          if (
            $env:GITHUB_REF_TYPE -eq 'tag' -and
            $env:GITHUB_REF_NAME -ne "v$($manifest.version)"
          ) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match package version '$($manifest.version)'."
          }

          $vsixPath = Join-Path $env:RUNNER_TEMP "$($manifest.name)-$($manifest.version).vsix"

          npx --no-install vsce package --out "$vsixPath"
          if ($LASTEXITCODE -ne 0) {
            throw "vsce package failed with exit code $LASTEXITCODE."
          }

          if (-not (Test-Path -LiteralPath $vsixPath -PathType Leaf)) {
            throw "VSIX was not created: $vsixPath"
          }

          Add-Content `
            -LiteralPath $env:GITHUB_OUTPUT `
            -Value "vsix_path=$vsixPath" `
            -Encoding utf8

      - name: 验证 VSIX 运行依赖（安装完整性）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VSIX_PATH: ${{ steps.package.outputs.vsix_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $extractRoot = Join-Path $env:RUNNER_TEMP 'vsix-verify'
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          tar.exe -xf "$env:VSIX_PATH" -C $extractRoot
          $extensionRoot = Join-Path $extractRoot 'extension'
          npm run verify:packaged-dependencies -- "$extensionRoot"
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged dependency verification failed with exit code $LASTEXITCODE."
          }

      - name: 检查发布凭据
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        id: creds
        shell: pwsh
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          $hasVsce = -not [string]::IsNullOrWhiteSpace($env:VSCE_PAT)
          $hasOvsx = -not [string]::IsNullOrWhiteSpace($env:OVSX_PAT)

          if (-not $hasVsce) {
            Write-Host 'VSCE_PAT 未配置，跳过 VS Code Marketplace 发布。'
          }
          if (-not $hasOvsx) {
            Write-Host 'OVSX_PAT 未配置，跳过 Open VSX 发布。'
          }

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "has_vsce=$hasVsce" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "has_ovsx=$hasOvsx" -Encoding utf8

      - name: 发布到 VS Code Marketplace
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && steps.creds.outputs.has_vsce == 'True'
        shell: pwsh
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX_PATH: ${{ steps.package.outputs.vsix_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          npx --no-install vsce publish `
            --packagePath "$env:VSIX_PATH"

          if ($LASTEXITCODE -ne 0) {
            throw "VS Code Marketplace publish failed with exit code $LASTEXITCODE."
          }

      - name: 发布到 Open VSX
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && steps.creds.outputs.has_ovsx == 'True'
        shell: pwsh
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX_PATH: ${{ steps.package.outputs.vsix_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          npx --yes ovsx@1.0.2 publish `
            "$env:VSIX_PATH" `
            -p "$env:OVSX_PAT"

          if ($LASTEXITCODE -ne 0) {
            throw "Open VSX publish failed with exit code $LASTEXITCODE."
          }

      - name: 打包 Windows EXE 安装程序（IExpress 自解压，运行后自动安装 VSIX）
        if: runner.os == 'Windows'
        id: exe
        shell: pwsh
        env:
          VSIX_PATH: ${{ steps.package.outputs.vsix_path }}
        run: |
          $ErrorActionPreference = 'Stop'

          $packageJson = Join-Path $env:GITHUB_WORKSPACE 'package.json'
          $manifest = Get-Content -LiteralPath $packageJson -Raw | ConvertFrom-Json
          $vsixName = "$($manifest.name)-$($manifest.version).vsix"

          $srcDir = Join-Path $env:RUNNER_TEMP 'sfx-src'
          New-Item -ItemType Directory -Path $srcDir -Force | Out-Null
          Copy-Item -LiteralPath $env:VSIX_PATH -Destination (Join-Path $srcDir $vsixName) -Force

          $exePath = Join-Path $env:RUNNER_TEMP "$($manifest.name)-$($manifest.version)-Setup-Windows.exe"
          $sedPath = Join-Path $env:RUNNER_TEMP 'setup.sed'

          # IExpress SED：自解压并静默执行 code --install-extension（code CLI 不在 PATH 时仅解压不报错阻断）
          $sed = @"
          [Version]
          Class=IEXPRESS
          SEDVersion=1
          [Options]
          PackagePurpose=InstallApp
          ShowInstallProgramWindow=0
          HideInstallProgramWindow=1
          AppLaunched=cmd /c code --install-extension $vsixName
          PostInstallCmd=<None>
          AdminQuietInstCmd=<None>
          UserQuietInstCmd=<None>
          TargetName=$exePath
          SourceFiles0=$srcDir\
          [SourceFiles]
          SourceFiles0=$srcDir\%
          [SourceFiles0]
          %FILE0%=
          $vsixName=
          "@

          Set-Content -LiteralPath $sedPath -Value $sed -Encoding ascii

          # iexpress.exe 会异步派生子进程完成打包后立即返回（$LASTEXITCODE 不可靠），
          # 因此不依赖其退出码，改为轮询等待产物 EXE 生成。
          Start-Process -FilePath 'iexpress.exe' -ArgumentList "/N /Q `"$sedPath`"" -WindowStyle Hidden | Out-Null

          $deadline = (Get-Date).AddSeconds(180)
          while (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
            if ((Get-Date) -gt $deadline) {
              throw "Windows EXE installer was not created within 180s: $exePath"
            }
            Start-Sleep -Seconds 2
          }
          # 等待文件写入完成（大小稳定）
          $lastSize = -1
          for ($i = 0; $i -lt 30; $i++) {
            $size = (Get-Item -LiteralPath $exePath).Length
            if ($size -eq $lastSize -and $size -gt 0) { break }
            $lastSize = $size
            Start-Sleep -Seconds 2
          }

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "exe_path=$exePath" -Encoding utf8

      - name: 上传 VSIX 产物
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix_path }}
          if-no-files-found: error

      - name: 上传 Windows EXE 安装程序
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-exe
          path: ${{ steps.exe.outputs.exe_path }}
          if-no-files-found: error

      - name: 上传 M2Reloader 原生组件
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: m2-reloader-win-x64
          path: tools/M2Reloader/runtime/native-win-x64/M2Reloader.exe
          if-no-files-found: error

  # ---- GitHub Release 发布（仅 tag 触发，最低权限 contents:write）----

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载 VSIX 产物
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: dist

      - name: 下载 Windows EXE 安装程序
        uses: actions/download-artifact@v8
        with:
          name: windows-installer-exe
          path: dist

      - name: 下载 M2Reloader 原生组件
        uses: actions/download-artifact@v8
        with:
          name: m2-reloader-win-x64
          path: dist

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**
          generate_release_notes: true
          draft: false
